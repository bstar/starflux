name: Release builds
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/check-version.py
  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml
  arch:
    needs: guard
    uses: ./.github/workflows/arch.yml
  macos:
    needs: guard
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: scripts/dist/macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: starflux-macos-client
          path: dist/*-aarch64-apple-darwin.tar.gz
          if-no-files-found: error
  appimage:
    needs: guard
    uses: ./.github/workflows/appimage.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ci, arch, macos, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: staging
      - name: Collect and checksum verified artifacts
        run: |
          mkdir dist
          cp staging/starflux-appimage-*/*.AppImage dist/
          cp staging/starflux-macos-client/*.tar.gz dist/
          cp staging/starflux-arch/* dist/
          cd dist
          sha256sum -- * | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --title "S T A R / F L U X $RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG#v}.md" --verify-tag
