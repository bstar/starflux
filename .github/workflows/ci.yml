name: ci
on:
  push:
    branches: [main]
    paths-ignore: &distribution
      - '**/*.md'
      - 'docs/**'
      - 'packaging/AppRun'
      - 'packaging/arch/**'
      - 'scripts/dist/**'
      - '.github/workflows/appimage.yml'
      - '.github/workflows/arch.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths-ignore: *distribution
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Free unused runner SDKs
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - uses: DeterminateSystems/magic-nix-cache-action@f69a2d3e148e90223fe63ab6e3f6331f2e7e33dc
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ""
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          cache-on-failure: true
      - name: Verify source, dependencies and headless behavior
        run: nix develop -c scripts/check-release
      - name: Verify the installed Nix package
        run: nix flake check --print-build-logs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostics-${{ matrix.runner }}
          path: target/*proof*/
