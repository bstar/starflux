[package]
name = "starmux"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A STAR/KIT workspace with native terminals and persistent local/SSH apps"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starkit = { git = "https://github.com/bstar/starkit", rev = "7c4e223fb8e3db1df7e2f25348d2f83cf1d1c8a1", version = "0.12", default-features = false, features = ["terminal-graphics"] }
crossbeam-channel = "0.5"
shell-words = "1"
libc = "0.2"
tracing = "0.1"
base64 = "0.22"
percent-encoding = "2"
sha2 = "0.10"
png = "0.17"
vt100 = "0.16.2"
portable-pty = "0.9"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7", default-features = false, features = ["desktop", "wayland_frontend", "backend_egl", "backend_gbm", "renderer_gl", "renderer_pixman", "xwayland"] }

[patch.crates-io]
# STAR/FOLD's extension-aware parser also guards zero mouse coordinates.
crossterm = { path = "vendor/crossterm" }

[profile.release]
opt-level = 2
debug = 1
