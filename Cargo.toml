[package]
name = "starflux"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A STAR/KIT workspace with native terminals and persistent local/SSH apps"
repository = "https://github.com/bstar/starflux"
readme = "README.md"

[workspace]
members = ["terminal-client"]
resolver = "2"

[workspace.dependencies]
starkit = { git = "https://github.com/bstar/starkit", rev = "f60a8fb3ffb41a5625c0c3d43e97394f2249ce61", version = "0.13", default-features = false, features = ["terminal-graphics", "media"] }

[features]
default = ["lossless-canvas", "gpu-renderer"]
lossless-canvas = []
gpu-renderer = ["starkit/gpu-renderer"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
starkit.workspace = true
crossbeam-channel = "0.5"
shell-words = "1"
libc = "0.2"
tracing = "0.1"
base64 = "0.22"
percent-encoding = "2"
sha2 = "0.10"
png = "0.17"
gst = { package = "gstreamer", version = "0.25", features = ["v1_24"] }
gst_app = { package = "gstreamer-app", version = "0.25", features = ["v1_24"] }
uuid = { version = "1", features = ["v4"] }
gio = "0.22"
gio-unix = "0.22"
vt100 = "0.16.2"
portable-pty = "0.9"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7", default-features = false, features = ["desktop", "wayland_frontend", "backend_egl", "backend_gbm", "renderer_gl", "renderer_pixman", "xwayland"] }

[patch.crates-io]
# STAR/FOLD's extension-aware parser also guards zero mouse coordinates.
crossterm = { path = "vendor/crossterm" }

[dev-dependencies]
gst_video = { package = "gstreamer-video", version = "0.25", features = ["v1_24"] }

[profile.release]
opt-level = 2
debug = 1
overflow-checks = true
