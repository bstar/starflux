# Same release policy as STAR/FOLD: advisories and unknown sources fail.
[advisories]
yanked = "deny"
unmaintained = "workspace"
[licenses]
allow = ["0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib"]
[licenses.private]
ignore = true
[bans]
multiple-versions = "allow"
wildcards = "deny"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/bstar/starkit"]
[[licenses.exceptions]]
name = "ffmpeg-next"
allow = ["WTFPL"]
[[licenses.exceptions]]
name = "ffmpeg-sys-next"
allow = ["WTFPL"]
